# arc-plugin 默认配置
# 请勿直接修改本文件；首次加载会在 config/config.yaml 生成一份用户配置，改那份即可。

# 后端 invtwd-server
server:
  # 查分服务地址（不带末尾斜杠）
  base_url: "http://127.0.0.1:8080"
  # server.api_key（Bearer Token），留空表示不带认证（仅本机调试用）
  api_key: ""
  # 单次 HTTP 请求超时（毫秒）
  timeout_ms: 15000

# 命令指令头：匹配 ^[#/]<cmdhead>...，默认 a（如 #ab50 / /a绑定）
cmdhead: "a"

# 出图底部栏
footer:
  # 底部栏中间固定显示 "Generated by <名称>"，这里只填 <名称> 部分；支持热重载。
  # 留空则自动用云崽机器人昵称，昵称也取不到时回退 YunluluBot。
  bot_name: ""

# 是否监听配置文件变化：true 时手动改 config.yaml 后自动热重载，
# false 则需重启生效。全局仅建一个监听器，不随热重载累积。
# （注意：指令头 cmdhead 的命令正则在加载时固定，任何方式改动都需重启）
watch_config: true

# 任务结果等待（服务端经 SSE 长连接一次性交付，不再轮询）
poll:
  # 单曲等普通查询从提交到出结果的最长等待（毫秒），超时走 Last 兜底或提示
  max_wait_ms: 60000
  # B50 最长等待（毫秒）：后端单 worker 分批串行执行，queued 可能持续数十秒
  # （默认攒满 20 个请求或自队首 Job 起 40 秒 flush，再串行出图），故给更长的超时
  b50_max_wait_ms: 180000

# B50 本地渲染出图参数（透传给 renderB30）
b50:
  renderer: "auto"   # auto | shotium | puppeteer
  scale: 3           # 1=1000x1034, 3=3000x3102
  type: "webp"       # webp | png | jpeg
  quality: 95

# 曲绘 / 立绘等资源在线更新（QentimArt 静态源，增量同步到 resources/；拉 original_ill 与 assets）
assets:
  # 资源站地址（QentimArt 静态发布树；会自动去掉末尾的 /index.json 与斜杠）
  # 注意：务必用 https，官方站点会把 http 301 跳到 https，而底层 SDK 不跟随跳转
  base_url: "https://arcaea-resources.phira.link"
  # 下载并发连接数（过高可能触发 CDN 限流返回 503，默认 8 较稳）
  concurrency: 8
  # 本地改动处理策略：
  #   keep      保留本地已改动/多出来的文件（默认，适合本地替换过个别素材）
  #   overwrite 以服务端为准，并删除本地多余文件
  #   fail      有冲突则报错且不写入任何文件
  local_changes: "keep"
  # 单次 HTTP 请求超时（毫秒）
  timeout_ms: 60000
