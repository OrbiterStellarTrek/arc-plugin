<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Exo;src:url("fonts/Exo-SemiBold.ttf");font-weight:600}
@font-face{font-family:Geo;src:url("fonts/GeosansLight.ttf")}
body{margin:0;background:#2a1a30;}
div{height:40px;padding:6px 10px;color:#fff;font-size:19px;line-height:1.4;white-space:nowrap}
.a{font-family:Geo}
.b{font-family:Geo;-webkit-text-stroke:1.2px #2a1024;paint-order:stroke fill}
.c{font-family:Exo;font-weight:600;-webkit-text-stroke:1.2px #2a1024;paint-order:stroke fill}
.d{font-family:Geo;text-shadow:1px 0 #2a1024,-1px 0 #2a1024,0 1px #2a1024,0 -1px #2a1024,1px 1px #2a1024,-1px -1px #2a1024,1px -1px #2a1024,-1px 1px #2a1024}
.e{font-family:Exo;font-weight:600;text-shadow:1px 0 #2a1024,-1px 0 #2a1024,0 1px #2a1024,0 -1px #2a1024,1px 1px #2a1024,-1px -1px #2a1024,1px -1px #2a1024,-1px 1px #2a1024}
.f{font-family:Geo;-webkit-text-stroke:1.2px #2a1024}
</style></head><body>
<div class="a">12.061</div>
<div class="b">12.061</div>
<div class="c">12.061</div>
<div class="d">12.061</div>
<div class="e">12.061</div>
<div class="f">12.061</div>
</body></html>
